name: Bug Report
description: Something on the site is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill out as much as you can — it speeds up the fix.

  - type: textarea
    id: description
    attributes:
      label: What's broken?
      description: Describe what you expected to see vs. what you actually saw.
      placeholder: "Example: The 'Join the Waitlist' button on the Guided Trail page leads to a 404."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /programs/guided-trail
        2. Click "Join the Waitlist"
        3. See 404
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options:
        - Home
        - About
        - About / Team
        - Programs (overview)
        - Explorer's Trail
        - Foundations Trail
        - Guided Trail
        - Trail of Mastery
        - Digital Compass
        - Scholarship / Trail Forward
        - Donate
        - Contact
        - Other / Multiple
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device / browser
      multiple: true
      options:
        - Desktop — Chrome
        - Desktop — Firefox
        - Desktop — Safari
        - Desktop — Edge
        - Mobile — iOS Safari
        - Mobile — Android Chrome
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console errors, or anything else useful.
